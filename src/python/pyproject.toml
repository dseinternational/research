[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "dse-research-utils"
dynamic = ["version"]
description = "Shared library for DSE research projects."
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "arviz-plots>=1.3.0",
    "arviz-stats>=1.3.0",
    "arviz>=1.3.0",
    "azure-identity",
    "azure-storage-blob",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6,<2.5",  # numba requires numpy <2.5 (still true of 0.66.0); lift cap when numba supports 2.5
    "pandas>=3.0.5",
    "preliz>=0.27.1",
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",  # pandas 3.x's default `str` dtype is Arrow-backed; matches the conda core floor
    "pyyaml>=6.0.3",  # dse_research_utils.environment.check (dse-check-env console script)
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6"
]

[project.optional-dependencies]
# Heavyweight / system-binary plotting backends, kept out of the base install so
# every consumer is not forced to carry them. The helpers that need them lazy-import
# and raise a clear error when the extra is absent.
viz = ["seaborn>=0.13"]            # dse_research_utils.plot.grids (histogram grids)
graphs = ["graphviz", "networkx"]  # dse_research_utils.plot.graphs (needs system Graphviz)
notebook = ["jupyter>=1.1.1", "jupytext>=1.19.5"]  # notebook/Jupyter stack (ipython drives plot.io.display_image)
dependence = ["dcor"]              # dse_research_utils.ml.feature_dependence.distance_corr_matrix
# Shared pure-Python tail for consuming projects (the pip layer of the hybrid env
# model); the compiled scientific core lives in conda-forge (data/environment-core.yml).
tuning = ["optuna>=4.9.0", "optuna-integration>=4.9.0"]
io = ["orjson>=3.11.9", "tabulate>=0.10.0"]

[project.scripts]
dse-check-env = "dse_research_utils.environment.check:main"

[tool.hatch.version]
path = "src/dse_research_utils/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dse_research_utils"]

[tool.hatch.build.dev-mode]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "ANN",    # flake8-annotations
]
ignore = [
    "ANN401",  # generic utilities may accept or return arbitrary library values
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["dse_research_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
