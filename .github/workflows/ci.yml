name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run spellcheck
        run: pnpm run spellcheck

      - name: Check formatting
        run: pnpm run format:check

  build-python:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --package dse-research-utils

  test-python:
    strategy:
      fail-fast: false
      matrix:
        # Windows runs x64: uv.lock resolves no win-arm64 environment.
        os: [ubuntu-26.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Run pytest
        run: uv run --no-sync pytest

      # Lint and format results do not depend on the OS, so check them once.
      - name: Check Python lint and formatting
        if: runner.os == 'Linux'
        run: |
          uv run --no-sync ruff check src/python
          uv run --no-sync ruff format --check src/python
