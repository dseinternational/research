version: 2

updates:
  # uv workspace: the lockfile and the workspace root live at /, and uv resolves
  # the member in /src/python as part of it, so a single entry covers both.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: "Europe/London"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # numpy 2.5 is unreachable for anything depending on pymc: pytensor 3.3.0
      # pins numba <=0.66.0, and numba 0.66.0 still pins numpy <2.5. (numba
      # 0.67.0 has relaxed to numpy <2.6, but pytensor does not admit it yet.)
      # The ceiling in src/python/pyproject.toml records the same chain; raising
      # it only declares a range no resolver can use. Remove once a pytensor
      # release admits numba 0.67.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
    assignees:
      - frankbuckley

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: "Europe/London"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    assignees:
      - frankbuckley

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: "Europe/London"
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - frankbuckley
