# DEPRECATED — retained only while consuming repos migrate off conda.
#
# The canonical compiled core now lives in this package's own metadata:
# src/python/pyproject.toml (base `dependencies` plus the extras). Repos on uv
# inherit those floors transitively by depending on dse-research-utils and need
# nothing from this file. It is kept, unchanged in meaning, so that repos still
# running `dse-check-env environment.yml` in CI keep working until they migrate;
# a parity test (tests/test_environment_core_parity.py) fails if the floors here
# and in pyproject.toml drift apart. Delete this file, the `dse-check-env`
# console script and that test once every consuming repo is on uv.
#
# Former description follows.
#
# Canonical conda-forge "compiled core" for DSE data-science repositories.
#
# This is the single source of truth for the *binary* layer of the hybrid
# environment model. Every repo's environment.yml must pin these packages, from
# conda-forge, to identical specs so the compiled scientific stack cannot drift
# across repos. The pure-Python tail and the shared library are installed in the
# pip layer (dse-research-utils[...] extras); repo-specific compiled add-ons
# (e.g. the gradient-boosting stack lightgbm/xgboost/shap, or the rest of the
# columnar-data stack duckdb/pyreadstat) are declared in each repo on top of
# this core.
#
# Verify a repo against this file with:  dse-check-env path/to/environment.yml
#
# Keep these floors consistent with dse-research-utils' own dependency floors in
# pyproject.toml. No GPU/CUDA packages here — the base is CPU-only and
# cross-platform (macOS incl. arm64, Linux, Windows via WSL); GPU acceleration is an
# opt-in overlay (environment-gpu.yml).
channels:
  - conda-forge
dependencies:
  - python=3.14.7
  # --- core numerics (compiled) ---
  # numpy 2.5 is reachable on PyPI now (pytensor 3.3.1 admits numba 0.67.0,
  # which allows numpy <2.6) but NOT yet on conda-forge, which still ships
  # pytensor 3.3.0 -> numba <=0.66.0 -> numpy <2.5. pyproject.toml therefore
  # carries the wider `<2.6` ceiling while this conda core keeps `<2.5`; the
  # parity test compares floors only, so the two legitimately differ here.
  # Raise once conda-forge ships pytensor 3.3.1.
  - numpy>=2.4.6,<2.5
  - scipy>=1.18.0
  - pandas>=3.0.5
  # pandas 3.x's default `str` dtype is Arrow-backed, so PyArrow underpins every
  # string column. Declared explicitly because pandas only *constrains* pyarrow
  # (>=13.0.0) rather than depending on it — without this line its presence rests
  # on nutpie's dependency graph (`nutpie -> pyarrow-core`), and a change there
  # would silently drop every repo back to Python-backed strings. The full
  # `pyarrow` metapackage, not `pyarrow-core`: repos on this core also read and
  # write Parquet/Feather, so libparquet and friends belong in the shared core
  # rather than being re-declared per repo.
  # Floor is 24.0.0, not the current 25.0.0, because libarrow 25.x needs
  # libabseil >=20260526 while every conda-forge jaxlib build (through jax
  # 0.10.2, still the newest there) pins libabseil <20260108 — the two do not
  # co-solve. Raise this once jaxlib is rebuilt against the newer abseil.
  - pyarrow>=24.0.0
  # Cap tracks whatever the admitted pytensor accepts. conda-forge's newest
  # pytensor is still 3.3.0, which caps numba at 0.66.0; PyPI's pytensor 3.3.1
  # has raised that to 0.67.0. Note this cap is what holds the numpy cap above:
  # numba 0.66.0 still pins <2.5.
  - numba>=0.58,<=0.66.0
  - matplotlib>=3.11.1
  - scikit-learn>=1.9.0
  - statsmodels>=0.15.0
  # --- columnar dataframes ---
  # Promoted from a repo-specific add-on so the Arrow-backed dataframe layer
  # cannot drift across repos. polars ships its own Rust Arrow implementation
  # and interoperates zero-copy with the pyarrow above, so the two want matched
  # versions everywhere rather than per-repo floors. Repos that do not use
  # polars still declare it: the core is a single lockstep spec, not an
  # à-la-carte list.
  - polars>=1.44.1
  # --- Bayesian modelling stack ---
  # pymc pulls pytensor + a C toolchain from conda-forge. PyMC admits
  # pytensor >=3.2.2,<3.4; conda-forge's pytensor 3.3.0 caps numba <=0.66.0,
  # which in turn caps numpy <2.5. Floors are the minimum supported, not exact
  # pins — pyproject.toml floors pytensor at 3.3.1, which conda-forge lacks.
  - pymc>=6.3.1
  - nutpie>=0.16.11
  - numpyro>=0.21.0
  - jax>=0.10.2 # CPU build; GPU acceleration via environment-gpu.yml
  - arviz>=1.3.0
  - arviz-base>=1.3.0
  - arviz-stats>=1.3.2
  - arviz-plots>=1.3.1
  - preliz>=0.28.0
  # --- serialization / storage (system libraries) ---
  - h5py>=3.16.0
  - h5netcdf>=1.8.1
  # --- graph rendering (system Graphviz) ---
  - graphviz>=14.1.2
  - python-graphviz>=0.21
