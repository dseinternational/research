name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run spellcheck
        run: npm run spellcheck

      - name: Check formatting
        run: npm run format:check

  build-python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --package dse-research-utils

  test-python:
    strategy:
      fail-fast: false
      matrix:
        # Native Windows is now covered. It was previously omitted because
        # jax/jaxlib have no conda-forge win-64 build, which forced Windows
        # contributors onto WSL; on PyPI jaxlib publishes cp314 win_amd64
        # wheels, so the whole stack installs natively.
        #
        # Intel macOS is absent because upstream has dropped it: numba ships no
        # macosx x86_64 wheels at all. See `tool.uv.environments` in
        # pyproject.toml.
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked fails the build if uv.lock is stale rather than silently
      # resolving something different from what was reviewed. uv provisions the
      # interpreter itself from .python-version, so there is no setup-python step.
      - name: Install the locked environment
        run: uv sync --locked

      - name: Run pytest
        run: uv run --no-sync pytest
