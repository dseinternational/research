name: dse-research
channels:
  - conda-forge
dependencies:
  # ── shared conda-forge compiled core ──────────────────────────────────────
  # Single source of truth: src/python/src/dse_research_utils/data/environment-core.yml
  # These lines must match that spec exactly. Verify with:
  #   dse-check-env environment.yml
  - python=3.14.6
  - numpy>=2.4.6,<2.5 # pymc 6.3.1 -> pytensor 3.3.0 -> numba <=0.66.0 -> numpy <2.5; numpy 2.5.2 remains unreachable
  - scipy>=1.18.0
  - pandas>=3.0.5
  - pyarrow>=24.0.0 # pandas 3.x's default `str` dtype is Arrow-backed; floor held at 24 by jaxlib's libabseil pin — see environment-core.yml
  - numba>=0.58,<=0.66.0 # pymc 6.3.1 admits pytensor 3.3.0, which caps numba at 0.66.0; numba still pins numpy <2.5
  - matplotlib>=3.11.1
  - scikit-learn>=1.9.0
  - statsmodels>=0.14.6
  - polars>=1.43.2 # canonical core: Arrow-backed dataframe layer, kept in lockstep with pyarrow above
  - pymc>=6.3.1 # pulls current pytensor 3.3.0 + a C toolchain; pytensor caps numba <=0.66.0 -> numpy <2.5
  - nutpie>=0.16.11
  - numpyro>=0.21.0
  - jax>=0.10.2 # CPU build; GPU acceleration via environment-gpu.yml
  - arviz>=1.3.0
  - arviz-base>=1.3.0
  - arviz-stats>=1.3.0
  - arviz-plots>=1.3.0
  - preliz>=0.27.1
  - h5py>=3.16.0
  - h5netcdf>=1.8.1
  - graphviz>=14.1.2
  - python-graphviz>=0.21
  # ── research add-ons (compiled / columnar data / system binaries) ─────────
  - lightgbm>=4.7.0
  - xgboost>=3.3.0
  - shap>=0.52.0
  - duckdb>=1.5.5
  - pyreadstat>=1.3.5
  - xarray>=2026.7.0
  - zarr
  - networkx
  - pandoc
  - pip
  - pip:
      # This repo installed editable, with the shared extras. This pulls the
      # library's own runtime deps (azure-identity/-storage-blob, psutil, rich,
      # pyyaml, …) and the pure-Python tail (seaborn, ipython/jupyter, dcor,
      # optuna, orjson/tabulate) via the extras — no need to list them again.
      - -e ./src/python[viz,notebook,dependence,tuning,io]
      # research-only pure-Python
      - formulaic
      - mpmath
      - pingouin
      - plotly
      - pyxlsb
      # typing stubs + dev / build tooling
      - pandas-stubs
      - scipy-stubs
      - hatch
      - build
      - pytest>=9.1.1
      - ruff>=0.16.1
      - setuptools>=83.0.0
